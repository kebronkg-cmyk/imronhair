# Netlify: die aktuelle Fassung (/fenster/) als Startseite.
# GitHub Pages liest diese Datei nicht — dort bleibt alles, wie es ist.
# Rückgängig: den Redirect-Block löschen.

[build]
  publish = "."

# 302 statt 301, damit Browser die Weiterleitung nicht fest speichern
# und ein Rückbau sofort wirkt. force: die Wurzel hat eine eigene
# index.html, ohne force würde Netlify sie ausliefern.
[[redirects]]
  from = "/"
  to = "/fenster/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/fenster/"
  status = 302
  force = true
