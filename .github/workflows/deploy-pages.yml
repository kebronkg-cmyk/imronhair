name: Website auf GitHub Pages ausliefern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Ausgeliefert wird nur, was die Besucher sehen: die Seiten, ihre
      # Stile, Skripte, Bilder und Schriften. Notizen (*.md), Recherche,
      # Werkzeuge, die PHP-Schnittstelle und das Studio bleiben im Repo und
      # gehen nicht ins Netz. Die Schnittstelle läuft auf All-Inkl.
      - name: Seite zusammenstellen
        run: |
          set -euo pipefail
          mkdir -p _site/api

          # Die Hauptseite (das Schaufenster bei Nacht) an der Wurzel: Seiten,
          # Stile, Skripte, Bilder, Schriften, Zeichen.
          cp index.html leistungen.html impressum.html datenschutz.html termin.html nachrichten.html \
             neu.css neu.js termin.css termin.js termin-vorschau.js nachrichten.js logo-*.svg _site/
          cp -r bilder schrift _site/

          # Die älteren Fassungen unter ihren Pfaden (/spiegel/, /schleife/, /alt/, /alt2/).
          cp -r spiegel schleife alt alt2 _site/

          # Die Terminvorschau liest den öffentlichen Katalog (Leistungen,
          # Dauer, Team) — nur diese eine Datei aus api/.
          cp api/katalog.json _site/api/

          # Weiterleitungen; Anker (#…) und ?salon=… bleiben erhalten. Erstes
          # Feld: Pfad der alten Adresse, zweites: Ziel, relativ zur Wurzel.
          weiterleiten() {
            pfad="$1"; ziel="$2"
            datei="_site/${pfad}"
            case "$pfad" in */|"") datei="${datei}index.html" ;; esac
            mkdir -p "$(dirname "$datei")"
            # Für Seiten in Unterordnern (/unsere-preise/) eine Ebene zurück.
            tiefe=$(printf '%s' "$pfad" | tr -cd '/' | wc -c)
            vor=""; for _ in $(seq 1 "$tiefe"); do vor="../${vor}"; done
            ziel="${vor}${ziel}"
            [ -n "$ziel" ] || ziel="./"
            cat > "$datei" <<EOF
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <title>Irmonhair · Friseur in München</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="${ziel}">
          <meta http-equiv="refresh" content="0; url=${ziel}">
          <script>location.replace('${ziel}' + location.search + location.hash);</script>
          </head>
          <body><p><a href="${ziel}">Weiter zur Website von Irmonhair</a></p></body>
          </html>
          EOF
          }
          # Die frühere Ablage unter /fenster/ (Links aus Bestätigungen,
          # Lesezeichen, geteilte Links) …
          weiterleiten "fenster/"                 ""
          weiterleiten "fenster/index.html"       ""
          weiterleiten "fenster/leistungen.html"  "leistungen.html"
          weiterleiten "fenster/termin.html"      "termin.html"
          weiterleiten "fenster/impressum.html"   "impressum.html"
          weiterleiten "fenster/datenschutz.html" "datenschutz.html"
          # … und die Adressen der früheren Website unter irmonhair-muenchen.de,
          # damit Links bei Google, Planity und in Lesezeichen weiter tragen.
          weiterleiten "unsere-preise/"               "leistungen.html"
          weiterleiten "ueberblick-leistungen/"       "leistungen.html"
          weiterleiten "frauen-herrenhaarschnitte/"   "leistungen.html#schnitt"
          weiterleiten "impressum/"                   "impressum.html"
          weiterleiten "datenschutz/"                 "datenschutz.html"
          weiterleiten "danke/"                       ""

          # Sicherheitsnetz: keine Notizen, Skripte oder Quelldaten im Netz.
          find _site \( -name '*.md' -o -name '*.py' -o -name '*.php' \
                        -o -name '*.mjs' -o -name '.DS_Store' \) -delete
          # Versteckte Ordner (z. B. .impeccable mit Design-Notizen) ebenso.
          find _site -mindepth 1 -name '.*' -prune -exec rm -rf {} +
          touch _site/.nojekyll
          echo "Ausgeliefert:"; find _site -maxdepth 2 | sort | head -60

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
