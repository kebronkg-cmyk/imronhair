<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irmonhair Studio</title>
<meta name="theme-color" content="#0d0907">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../fenster/logo-schleife.svg" type="image/svg+xml">
<link rel="preload" href="../fenster/schrift/Jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fenster/schrift/Mulish.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="studio.css">
<!-- Wo die Schnittstelle liegt, relativ zu dieser Seite. -->
<meta name="irmonhair-api" content="../api/">
</head>
<body>

<!-- Solange das Skript lädt — und ohne Skript. -->
<div class="start" id="start">
  <p class="start-marke">Irmonhair <span>Studio</span></p>
  <p class="start-text" id="start-text">Wird geladen &hellip;</p>
  <noscript><p class="start-text">Das Studio braucht JavaScript.</p></noscript>
</div>

<!-- Anmeldung und Einrichtung -->
<main class="tor" id="tor" hidden>
  <form class="tor-karte" id="tor-form" novalidate>
    <p class="tor-marke">Irmonhair <span>Studio</span></p>
    <h1 class="tor-titel" id="tor-titel">Anmelden</h1>
    <p class="tor-text" id="tor-text"></p>
    <div id="tor-felder"></div>
    <p class="tor-fehler" id="tor-fehler" role="alert" hidden></p>
    <button class="knopf tor-knopf" type="submit" id="tor-knopf">Anmelden</button>
  </form>
</main>

<!-- Die Arbeitsfläche -->
<div class="app" id="app" hidden>
  <header class="kopf">
    <a class="kopf-marke" href="#kalender" aria-label="Irmonhair Studio, Kalender">
      <span class="kopf-wort">Irmonhair</span><span class="kopf-zusatz">Studio</span>
    </a>
    <nav class="bereiche" id="bereiche" aria-label="Bereiche"></nav>
    <div class="kopf-rechts">
      <button class="suche-knopf" id="suche-knopf" type="button" aria-label="Kunden suchen (Taste /)">
        <svg class="zeichen" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>
        <span>Suchen</span><kbd>/</kbd>
      </button>
      <button class="ich" id="ich" type="button" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="ich-menue" id="ich-menue" role="menu" hidden></div>
    </div>
  </header>

  <main class="flaeche" id="flaeche" tabindex="-1"></main>
</div>

<!-- Seitentafel (Termin, Kunde, Person …) und Dialoge -->
<div class="tafel-grund" id="tafel-grund" hidden></div>
<aside class="tafel" id="tafel" hidden aria-modal="true" role="dialog" aria-labelledby="tafel-titel" tabindex="-1"></aside>
<dialog class="frage" id="frage"></dialog>
<div class="meldungen" id="meldungen" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
